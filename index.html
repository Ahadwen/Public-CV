<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alastair Hadwen — CV</title>
<meta name="description" content="CV of Alastair Hadwen, Senior Product Manager based in Berlin.">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0e0e0c;
  --paper: #f5f2eb;
  --paper2: #ede9df;
  --accent: #c84b2f;
  --mid: #7a7568;
  --light: #b8b2a4;
  --serif: 'Fraunces', Georgia, serif;
  --sans: 'Instrument Sans', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--paper2);
  color: var(--ink);
  font-family: var(--sans);
}
header {
  max-width: 900px;
  margin: 0 auto;
  padding: 48px 24px 28px;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
}
h1 {
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(36px, 6vw, 56px);
  line-height: 1;
  letter-spacing: -0.02em;
}
h1 em { font-style: italic; color: var(--accent); }
.sub {
  margin-top: 10px;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--mid);
}
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  display: inline-block;
  padding: 12px 20px;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-decoration: none;
  border: 1px solid var(--ink);
  color: var(--ink);
  background: transparent;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--ink); border-color: var(--ink); color: #fff; }
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 24px 56px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.page {
  width: 100%;
  height: auto;
  display: block;
  background: #fff;
  box-shadow: 0 4px 24px rgba(0,0,0,0.12);
}
footer {
  text-align: center;
  padding: 0 24px 48px;
  font-size: 12px;
  color: var(--mid);
}
footer a { color: var(--mid); }
footer a:hover { color: var(--accent); }
</style>
</head>
<body>

<header>
  <div>
    <h1>Alastair <em>Hadwen</em></h1>
    <div class="sub">Senior Product Manager · Berlin</div>
  </div>
  <div class="actions">
    <a class="btn primary" href="cv/Alastair_Hadwen_CV.pdf" download="Alastair_Hadwen_CV.pdf">Download CV (PDF)</a>
    <a class="btn" href="https://ahadwen.github.io/Portfolio/">Portfolio</a>
  </div>
</header>

<main>
  <img class="page" src="cv/page-1.png" alt="CV of Alastair Hadwen, page 1">
  <img class="page" src="cv/page-2.png" alt="CV of Alastair Hadwen, page 2">
</main>

<footer>
  <a href="mailto:Alastair.Hadwen@gmail.com">Alastair.Hadwen@gmail.com</a> ·
  <a href="https://www.linkedin.com/in/alastair-hadwen-87b67b104">LinkedIn</a>
</footer>

</body>
</html>
