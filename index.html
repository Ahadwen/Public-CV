<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alastair Hadwen CV</title>
<style>
body { margin: 0; background: #fff; font-family: Arial, sans-serif; }
.wrap { max-width: 850px; margin: 0 auto; padding: 12px; }
.download { display: block; text-align: right; font-size: 14px; color: #1155cc; margin-bottom: 8px; }
img { width: 100%; height: auto; display: block; border: 1px solid #ddd; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="download" id="download" href="cv/Alastair_Hadwen_CV.pdf" download="Alastair_Hadwen_CV.pdf">Download PDF</a>
  <img src="cv/page-1.png" alt="CV page 1">
  <img src="cv/page-2.png" alt="CV page 2">
</div>
<script>
// Logs a view (and a download) in the Apryl Supabase project's apryl_visit_log table, with only the
// time and the browser's time zone. No IP address or anything else. Local development isn't counted.
// Needs supabase/0001_cv_page_visits.sql applied once; until then the calls fail silently.
(function () {
  var URL = 'https://vefbvrgnobfapzosivag.supabase.co/rest/v1/rpc/log_page_visit';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlZmJ2cmdub2JmYXB6b3NpdmFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4ODYzMzMsImV4cCI6MjA5NDQ2MjMzM30.oc213yAZjzYKOM-Bqg7aJUZae6T9Ax3MuoRQBIEz-gQ';
  function log(page) {
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:') return;
    var tz = null;
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || null; } catch (e) {}
    fetch(URL, {
      method: 'POST',
      headers: { apikey: KEY, authorization: 'Bearer ' + KEY, 'content-type': 'application/json' },
      body: JSON.stringify({ p_page: page, p_time_zone: tz }),
      keepalive: true
    }).catch(function () {});
  }
  log('cv');
  document.getElementById('download').addEventListener('click', function () { log('cv_download'); });
})();
</script>
</body>
</html>
