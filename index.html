<script>
// Counts a view with the existing apryl_count_visit function (apryl_visits and apryl_visit_log),
// storing only the time and the browser's time zone. Local development isn't counted.
(function () {
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:') return;
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlZmJ2cmdub2JmYXB6b3NpdmFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4ODYzMzMsImV4cCI6MjA5NDQ2MjMzM30.oc213yAZjzYKOM-Bqg7aJUZae6T9Ax3MuoRQBIEz-gQ';
  var tz = null;
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || null; } catch (e) {}
  fetch('https://vefbvrgnobfapzosivag.supabase.co/rest/v1/rpc/apryl_count_visit', {
    method: 'POST',
    headers: { apikey: KEY, authorization: 'Bearer ' + KEY, 'content-type': 'application/json' },
    body: JSON.stringify({ p_time_zone: tz }),
    keepalive: true
  }).catch(function () {});

  // Email alert (via ntfy.sh) when the visitor's browser is in Germany's time zone.
  if (tz === 'Europe/Berlin') {
    var when = new Date().toLocaleString('en-GB', { timeZone: 'Europe/London' });
    fetch('https://ntfy.sh/ahadwen-cv-8837735f4e52?title=' + encodeURIComponent('CV viewed from Germany') +
      '&email=' + encodeURIComponent('Alastair.Hadwen@gmail.com') + '&tags=eyes', {
      method: 'POST',
      mode: 'no-cors',
      body: 'Someone with a Europe/Berlin time zone opened your CV at ' + when + ' (UK time).',
      keepalive: true
    }).catch(function () {});
  }
})();
</script>
